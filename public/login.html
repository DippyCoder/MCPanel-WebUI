<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Sign in · MCPanel-WebUI</title>
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="login.css">
<style id="theme-override"></style>
</head>
<body class="login-body">

<main class="login-shell">

  <form class="login-card" id="login-form" novalidate>

    <div class="login-head">
      <img class="login-logo" src="assets/icon.png" width="54" height="54" alt="">
      <h1 class="login-title">MCPanel-WebUI</h1>
      <p class="login-sub">Sign in to manage your servers</p>
    </div>

    <div class="login-fields">
      <div class="form-group">
        <label for="login-username">Username</label>
        <input class="input" id="login-username" name="username" type="text"
               autocomplete="username" autocapitalize="none" autocorrect="off"
               spellcheck="false" required autofocus>
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <input class="input" id="login-password" name="password" type="password"
               autocomplete="current-password" required>
        <p class="login-caps hidden" id="login-caps" aria-live="polite">Caps Lock is on</p>
      </div>
    </div>

    <div class="login-error hidden" id="login-error" role="alert" aria-live="assertive"></div>

    <button class="btn-primary login-submit" id="login-submit" type="submit">
      <span class="login-spinner hidden" id="login-spinner" aria-hidden="true"></span>
      <span id="login-submit-label">Sign in</span>
    </button>

  </form>

  <p class="login-foot">MCPanel WebUI</p>

</main>

<script src="login.js"></script>
</body>
</html>
